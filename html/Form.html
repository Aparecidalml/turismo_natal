<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=122837&format=png&color=000000">
</head>

<body>
    <h1 style="text-shadow: 2px 2px #B8860B;">Fale Conosco</h1>
    <fieldset>
        <legend>Formulário</legend>
        <form>
            Nome: <input type="text" placeholder="coloque aqui seu nome" size="30"><br>
            E-mail*: <input type="email" placeholder="E-mail" required><br>
            Telefone: <input type="tel" readonly><br>
            Data de Nascimento: <input type="date"><br>
            Sexo: <input type="radio" name="sexo">Feminino
            <input type="radio" name="sexo">Masculino
            <input type="radio" name="sexo">Outros<br>
            Cidade: <select name="" id="">
                <option value="">Escolha aqui</option>
                <option value="">Natal</option>
                <option value="">SGA</option>
                <option value="">Extremoz</option>
                <option value="">Parnamirim</option>
            </select><br>
            Número: <input type="number" min="5" max="10"><br>
            Hora: <input type="time"><br>
            O que você deseja visitar?<br>
            <input type="checkbox"> Praias <br>
            <input type="checkbox"> Parques
            Insira sua sugestão/dúvida: <br>
            <textarea name="" id="duvida" rows="10" cols="30"></textarea><br>
            Cor: <input type="color"><br>
            Senha: <input type="password"><br>
            Inserir Arquivo: <input type="file"><br>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar" onclick="alert('Enviado com sucesso!')">
            <button> Botão </button>

        </form>
    </fieldset>
</body>

</html>
